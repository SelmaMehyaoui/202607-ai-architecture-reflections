[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "ai-architecture-experiments"
version = "0.1.0"
description = "Neutral experiments comparing AI execution boundaries"
requires-python = ">=3.11"
dependencies = ["mcp>=1.27,<2"]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["experiments"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["ASYNC221", "EXE001"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
files = [
  "experiments/execution-boundaries",
  "experiments/complete-ai-system-config/run_benchmark.py",
]
exclude = ["experiments/execution-boundaries/mcp-(local|isolated)/"]
